<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Армянский алфавит и язык для русскоговорящих: уроки, карточки, тренажёры." />
    <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101012" media="(prefers-color-scheme: dark)" />
    <script>
      // Цветовая тема и светлый/тёмный вид — до первой отрисовки, чтобы экран не мигал чужими цветами
      // (дальше их поддерживает src/app/App.svelte).
      try {
        var s = JSON.parse(localStorage.getItem("hy:progress") || "{}").settings || {};
        var r = document.documentElement;
        if (s.palette === "sevan" || s.palette === "pine") r.dataset.palette = s.palette;
        if (s.theme === "light" || s.theme === "dark") r.dataset.theme = s.theme;
      } catch (e) {}
    </script>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Այբուբեն" />
    <title>Այբուբեն — армянский алфавит</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
