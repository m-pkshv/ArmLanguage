<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Армянский алфавит</title>
  <meta name="description" content="Учим армянский алфавит: таблица букв, карточки и тесты на русском языке.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="hy">Այբուբեն</span> Армянский алфавит</div>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-view="alphabet" role="tab">Алфавит</button>
      <button class="tab" data-view="cards" role="tab">Карточки</button>
      <button class="tab" data-view="quiz" role="tab">Тест</button>
    </nav>
    <div class="progress" title="Буквы, на которые вы ответили правильно 3 раза подряд">
      <div class="progress-bar"><div id="progress-fill"></div></div>
      <span id="progress-text">0 / 39</span>
    </div>
  </header>

  <main>
    <div class="groups">
      <span>Буквы:</span>
      <div id="group-select" class="chips"></div>
    </div>

    <!-- Алфавит -->
    <section id="view-alphabet" class="view active">
      <p class="hint">Нажмите на букву, чтобы увидеть подробности. Зелёная точка — буква выучена.</p>
      <div id="grid" class="grid"></div>
    </section>

    <!-- Карточки -->
    <section id="view-cards" class="view">
      <p class="hint">Вспомните название и звук буквы, затем переверните карточку.</p>
      <div class="card-wrap">
        <div id="flashcard" class="flashcard" tabindex="0">
          <div class="face front"><div class="big hy" id="fc-letter"></div></div>
          <div class="face back" id="fc-back"></div>
        </div>
      </div>
      <div class="card-actions">
        <button id="fc-flip" class="btn">Перевернуть <kbd>пробел</kbd></button>
        <button id="fc-no" class="btn bad" disabled>Не помню <kbd>1</kbd></button>
        <button id="fc-yes" class="btn good" disabled>Помню <kbd>2</kbd></button>
      </div>
    </section>

    <!-- Тест -->
    <section id="view-quiz" class="view">
      <div class="chips quiz-modes">
        <button class="chip active" data-mode="letter">Буква → звук</button>
        <button class="chip" data-mode="sound">Звук → буква</button>
        <button class="chip" data-mode="word">Прочитай слово</button>
      </div>
      <div class="quiz">
        <div id="q-prompt" class="q-prompt"></div>
        <div id="q-options" class="q-options"></div>
        <div id="q-feedback" class="q-feedback"></div>
        <button id="q-next" class="btn" hidden>Дальше <kbd>Enter</kbd></button>
      </div>
      <p class="score">Правильно: <b id="q-score">0</b> из <b id="q-total">0</b></p>
    </section>
  </main>

  <dialog id="detail">
    <form method="dialog"><button class="close" aria-label="Закрыть">×</button></form>
    <div id="detail-body"></div>
  </dialog>

  <footer>
    <button id="reset" class="link">Сбросить прогресс</button>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
